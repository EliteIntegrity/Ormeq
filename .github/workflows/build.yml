name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Public data checks
        run: python tools/check_public.py
      - name: SDL3 build and gameplay regressions
        run: ./build.ps1 -Frontend sdl3 -NoCheck -Test
      - name: Sprite converter tests (synthetic artwork)
        run: |
          python -m pip install Pillow==12.0.0 numpy==2.3.5
          python tools/test_sprite_pack.py
      - name: Legacy Win32 build
        run: ./build.ps1 -Frontend win32 -NoCheck
      - name: Debug gameplay and stack-frame regression checks
        run: |
          cmake -S . -B out-none -DFROG_FRONTEND=none -DORMEQ_STACK_AUDIT=ON
          ./build.ps1 -Frontend none -Config Debug -NoCheck -Test
          python tools/check_stack_frames.py out-none/frames
